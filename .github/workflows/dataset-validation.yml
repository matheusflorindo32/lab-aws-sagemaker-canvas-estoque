name: Dataset validation

on:
  push:
    branches: [main, feat/professional-ml-portfolio]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Compile Python scripts
        run: python -m py_compile scripts/*.py src/inventory_forecasting/*.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate baseline dataset
        run: python scripts/validate_dataset.py

      - name: Run descriptive exploratory analysis
        run: python scripts/analyze_dataset.py
