name: Dataset validation

on:
  push:
    branches: [main, feat/professional-ml-portfolio]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: '3.12'

      - name: Compile Python scripts
        run: python -m py_compile scripts/*.py src/inventory_forecasting/*.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate baseline dataset
        run: python scripts/validate_dataset.py

      - name: Run descriptive exploratory analysis
        run: python scripts/analyze_dataset.py
