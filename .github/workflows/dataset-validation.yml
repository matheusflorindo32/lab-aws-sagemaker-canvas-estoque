name: Dataset validation

on:
  push:
    branches: [main, feat/professional-ml-portfolio]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate dataset
        run: python scripts/validate_dataset.py
