name: Python forecasting

on:
  push:
    branches: [main, feat/professional-ml-portfolio]
    paths:
      - 'src/**'
      - 'scripts/run_benchmarks.py'
      - 'tests/**'
      - 'datasets/**'
      - '.github/workflows/python-forecasting.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: '3.12'

      - name: Compile forecasting code
        run: python -m py_compile src/inventory_forecasting/*.py scripts/run_benchmarks.py scripts/train_autogluon.py scripts/train_autogluon_multifold.py app.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate source dataset
        run: python scripts/validate_dataset.py

      - name: Execute real benchmark backtests
        run: python scripts/run_benchmarks.py

      - name: Verify generated artifacts
        run: |
          test -s results/metrics/benchmark_metrics.csv
          test -s results/metrics/benchmark_multifold_metrics.csv
          test -s results/metrics/benchmark_multifold_summary.csv
          test -s results/predictions/benchmark_holdout_predictions.csv
          test -s results/predictions/benchmark_multifold_predictions.csv
          test -s results/exports/benchmark_leaderboard.csv
          test "$(($(wc -l < results/predictions/benchmark_holdout_predictions.csv) - 1))" -eq 525
          test "$(($(wc -l < results/predictions/benchmark_multifold_predictions.csv) - 1))" -eq 1575

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: inventory-forecasting-benchmarks
          path: |
            results/metrics/benchmark_metrics.csv
            results/metrics/benchmark_multifold_metrics.csv
            results/metrics/benchmark_multifold_summary.csv
            results/predictions/benchmark_holdout_predictions.csv
            results/predictions/benchmark_multifold_predictions.csv
            results/exports/benchmark_leaderboard.csv
          if-no-files-found: error
          retention-days: 30
