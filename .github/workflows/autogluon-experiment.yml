name: AutoGluon experiment

on:
  push:
    branches: [feat/professional-ml-portfolio]
    paths:
      - '.github/workflows/autogluon-experiment.yml'
      - 'requirements-ml.txt'
      - 'scripts/train_autogluon.py'
      - 'scripts/train_autogluon_multifold.py'
      - 'src/inventory_forecasting/autogluon_runner.py'
      - 'src/inventory_forecasting/metrics.py'
      - 'datasets/dataset-1000-com-preco-promocional-e-renovacao-estoque.csv'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autogluon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt

      - name: Run final holdout
        run: python scripts/train_autogluon.py --time-limit 180 --presets medium_quality

      - name: Run rolling-origin experiment
        run: python scripts/train_autogluon_multifold.py --time-limit 180 --presets medium_quality

      - name: Verify outputs
        run: |
          test -s results/autogluon/leaderboard.csv
          test -s results/autogluon/holdout_predictions.csv
          test -s results/autogluon/metrics_summary.csv
          test -s results/autogluon/calibration_by_sku.csv
          test -s results/autogluon/experiment_manifest.json
          test -s results/autogluon/multifold_leaderboard.csv
          test -s results/autogluon/multifold_metrics.csv
          test -s results/autogluon/multifold_predictions.csv
          test -s results/autogluon/multifold_summary.csv

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inventory-forecasting-autogluon
          path: results/autogluon/
          if-no-files-found: error
          retention-days: 30
