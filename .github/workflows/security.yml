name: Security scan

on:
  push:
    branches: [main, feat/professional-ml-portfolio]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Scan repository for high-risk secret patterns
        run: python scripts/scan_secrets.py

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit application dependencies
        run: python -m pip_audit -r requirements-app.txt

      - name: Audit ML dependencies
        run: python -m pip_audit -r requirements-ml.txt
