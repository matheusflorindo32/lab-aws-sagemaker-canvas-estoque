name: Security scan

on:
  push:
    branches: [main, feat/professional-ml-portfolio]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan repository for high-risk secret patterns
        run: python scripts/scan_secrets.py
